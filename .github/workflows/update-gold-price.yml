name: Auto Update Gold Price

on:
  schedule:
    # Runs at 10:37 AM, 1:37 PM, and 6:37 PM IST (uses :07 to avoid GitHub's :00 queue drops)
    - cron: '7 5,8,13 * * *'
    # Temporary test run for tonight at 8:07 PM IST (14:37 UTC) - remove after testing
    - cron: '37 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-price:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Fetch latest gold rate and update goldPrice.json
        run: node updateGoldPrice.js

      - name: Commit and push if price changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add goldPrice.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update goldPrice.json" && git push)
