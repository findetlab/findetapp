name: Auto Update Gold Price

on:
  schedule:
    # Runs 3 times a day: 10:30 AM, 1:30 PM, and 6:30 PM IST
    # (Cron uses UTC time: 05:00, 08:00, and 13:00 UTC)
    - cron: '0 5,8,13 * * *'
  workflow_dispatch: # Adds a manual "Run workflow" button in the GitHub Actions tab

permissions:
  contents: write

jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest gold rate and update goldPrice.json
        run: node updateGoldPrice.js

      - name: Commit and push if price changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add goldPrice.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update goldPrice.json" && git push)
